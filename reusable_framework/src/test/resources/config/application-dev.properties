# ============================================================
# DEV Environment — FSM Service
# To switch service: copy this file, change the values below.
# To switch environment: use -Denv=uat and create application-uat.properties
# ============================================================

# Database
db.url      = jdbc:sqlserver://dev-sql.database.windows.net:1433;databaseName=DevDB;encrypt=true
db.username = dev_user
db.password = dev_password

# API
api.baseUrl   = https://dev-api.yourcompany.com
api.authToken = Bearer your-token-here

# Azure Event Hub
eventhub.connectionString = Endpoint=sb://dev-eventhub.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=YOUR_KEY
eventhub.name             = fsm-hub
